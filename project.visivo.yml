name: nyc-cuisines
sources:
  - name: nyc-db
    type: duckdb
    database: ":memory:"
    attach:
      - schema_name: remote
        source:
          name: nyc_remote
          type: duckdb
          database: https://github.com/visivo-io/nyc-cuisine-dashboard/raw/refs/heads/main/nyc_food.duckdb

defaults:
  source_name: nyc-db

models:
  - name: restaurants
    # Named rather than `SELECT *`: the attached catalog's schema does not
    # reach the planner, so a star cannot be expanded into real columns.
    sql: |-
      SELECT restaurant_name, address, borough, postcode, latitude, longitude,
             cuisine, station_name, station_lat, station_lon, station_routes
      FROM remote.restaurants_with_station

    source: ${ref(nyc-db)}
  - name: station-counts
    sql: >
      SELECT station_name, station_lat, station_lon, station_routes, cuisine,
             restaurant_count, rank
      FROM (
        SELECT station_name, station_lat, station_lon, station_routes, cuisine,
               restaurant_count,
               ROW_NUMBER() OVER (PARTITION BY cuisine ORDER BY restaurant_count DESC) AS rank
        FROM remote.station_cuisine_counts
      ) WHERE rank <= 3

  - name: cuisine-list
    sql: SELECT DISTINCT rws.cuisine FROM remote.restaurants_with_station as rws ORDER BY cuisine

inputs:
  - name: cuisine-select
    label: "Select Cuisine Again"
    type: single-select
    options: ?{SELECT cuisine FROM ${ref(cuisine-list)}}
insights:
  - name: restaurant-markers
    props:
      type: scattermap
      lat: ?{${ref(restaurants).latitude}}
      lon: ?{${ref(restaurants).longitude}}
      text: ?{${ref(restaurants).restaurant_name} || ' - ' || ${ref(restaurants).address}}
      mode: markers
      marker:
        size: 7
        color: "#e74c3c"
        opacity: 0.7
      name: restaurants
    interactions:
      - filter: ?{${ref(restaurants).cuisine} = '${ref(cuisine-select).value}'}

  - name: station-bubbles
    props:
      type: scattermap
      lat: ?{${ref(station-counts).station_lat}}
      lon: ?{${ref(station-counts).station_lon}}
      text: ?{${ref(station-counts).station_name} || ' (' || ${ref(station-counts).station_routes} || ')'}
      mode: markers
      marker:
        size: ?{${ref(station-counts).restaurant_count}/16 + 10}
        color: "#3498db"
        opacity: 0.8
      name: subway-stations
    interactions:
      - filter: ?{${ref(station-counts).cuisine} = '${ref(cuisine-select).value}'}

charts:
  - name: cuisine-map
    insights:
      - ${ref(station-bubbles)}
      - ${ref(restaurant-markers)}
    layout:
      showlegend: false
      margin: {l: 0, r: 0, t: 0, b: 0}
      map:
        center:
          lat: 40.7128
          lon: -73.95
        zoom: 10

dashboards:
  - name: nyc-cuisine-dashboard
    rows:
      - height: compact
        items:
          - markdown:
              content: |
                # NYC Restaurant Cuisine Explorer
                Select a cuisine to see restaurants and best subway stops.
                Blue bubbles = subway stations (bigger = more restaurants nearby).
          - input: ${ref(cuisine-select)}
      - height: large
        items:
          - chart: ${ref(cuisine-map)}
